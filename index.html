<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Dữ Liệu</title>
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v11'/><path d='M8 7l4-4 4 4'/><path d='M12 21V10'/><path d='M8 17l4 4 4-4'/><path d='M4 12h2'/><path d='M18 12h2'/></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .hidden-el { display: none !important; }
        
        /* Hiệu ứng Toast Notification */
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-cyan-500/30 min-h-screen relative overflow-x-hidden">

    <!-- Background glow -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-600/20 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/20 blur-[120px]"></div>
    </div>

    <!-- Container chứa thông báo (Toast) -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- HEADER -->
    <header class="relative z-40 border-b border-white/10 bg-slate-900/80 backdrop-blur-md sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative group flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all duration-300 hover:shadow-[0_0_30px_rgba(6,182,212,0.8)] hover:scale-105">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 drop-shadow-md">
                        <path d="M12 3v11"></path><path d="M8 7l4-4 4 4"></path><path d="M12 21V10"></path><path d="M8 17l4 4 4-4"></path><path d="M4 12h2"></path><path d="M18 12h2"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)] tracking-wide">
                    Kho Dữ Liệu
                </h1>
            </div>

            <div id="auth-container">
                <button onclick="openLoginModal()" id="btn-login-trigger" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-colors text-sm">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Admin
                </button>
                
                <div id="admin-controls" class="hidden-el flex items-center gap-3">
                    <button onclick="openAdminPanel()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/20 transition-all text-sm font-medium">
                        <i data-lucide="plus" class="w-4 h-4"></i> Thêm Tài Nguyên
                    </button>
                    <button onclick="handleLogout()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-colors text-sm">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Thoát
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="text-center mb-8">
            <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                Khám phá & Lưu trữ <span class="text-cyan-400">Tài nguyên</span>
            </h2>
            <p class="text-slate-400 text-base max-w-2xl mx-auto">
                Hệ thống quản lý, chia sẻ tài liệu trực tuyến (Powered by Firebase).
            </p>
        </div>

        <div id="loading-state" class="flex justify-center items-center py-10">
            <div class="flex flex-col items-center gap-3">
                <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-sm text-cyan-400 animate-pulse">Đang kết nối cơ sở dữ liệu...</span>
            </div>
        </div>
        
        <div id="empty-state" class="hidden-el text-center py-20 flex flex-col items-center opacity-60">
            <i data-lucide="database" class="w-16 h-16 mb-4 text-slate-500"></i>
            <p class="text-lg">Kho dữ liệu hiện đang trống.</p>
        </div>

        <div id="resources-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden-el">
            <!-- Dữ liệu render tại đây -->
        </div>
    </main>

    <!-- MODAL LOGIN -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden-el">
        <div class="bg-slate-900 border border-slate-700/50 rounded-2xl w-full max-w-md p-8 relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                    <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Admin Login</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                    <!-- Đã xóa value gợi ý -->
                    <input type="email" id="login-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="Nhập email admin...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
                    <!-- Đã xóa value gợi ý -->
                    <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="Nhập mật khẩu...">
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-xl transition-all duration-300 mt-6">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <!-- MODAL ADMIN THÊM/SỬA -->
    <div id="admin-panel-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden-el overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700/50 rounded-2xl w-full max-w-4xl my-8 relative shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between p-5 border-b border-white/5">
                <h2 id="modal-title" class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus" class="text-cyan-400 w-5 h-5"></i> Thêm Tài Nguyên Mới
                </h2>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg hover:bg-slate-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
                <form id="resourceForm" onsubmit="handleSaveResource(event)">
                    <input type="hidden" id="res-id">
                    
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Tên tài nguyên <span class="text-red-400">*</span></label>
                            <input type="text" id="res-title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500" placeholder="Ví dụ: Tool Download Video">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Mô tả ngắn</label>
                            <textarea id="res-desc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full mb-6"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Cột Trái: Tài Nguyên -->
                        <div class="bg-slate-800/30 p-5 rounded-2xl border border-white/5">
                            <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
                                <i data-lucide="file-box" class="w-5 h-5 text-cyan-400"></i> Nguồn Tài Nguyên
                            </h3>
                            <div class="grid grid-cols-2 gap-2 mb-4">
                                <button type="button" onclick="setResType('file')" id="btn-type-file" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-cyan-500/20 border-cyan-500 text-cyan-400 text-sm">
                                    <i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload File
                                </button>
                                <button type="button" onclick="setResType('link')" id="btn-type-link" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-slate-800 border-slate-700 text-slate-400 text-sm">
                                    <i data-lucide="link" class="w-4 h-4"></i> Gắn Link
                                </button>
                            </div>

                            <div id="area-res-file" class="p-6 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800/50 hover:bg-slate-800 transition-colors h-[120px] flex items-center justify-center">
                                <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event, 'file')">
                                <div class="flex flex-col items-center justify-center text-center cursor-pointer w-full h-full" onclick="document.getElementById('file-input').click()">
                                    <i data-lucide="upload-cloud" class="w-8 h-8 text-cyan-400 mb-2"></i>
                                    <span class="text-sm font-medium text-slate-300 mb-1">Click chọn file</span>
                                    <span id="file-status-text" class="text-xs text-slate-500 text-center px-2">Khuyên dùng Link Drive cho file nặng</span>
                                </div>
                            </div>

                            <div id="area-res-link" class="hidden-el h-[120px]">
                                <label class="block text-sm text-slate-400 mb-2">Đường dẫn Google Drive / Mega:</label>
                                <input type="url" id="res-link-val" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500" placeholder="https://...">
                            </div>
                        </div>

                        <!-- Cột Phải: Icon -->
                        <div class="bg-slate-800/30 p-5 rounded-2xl border border-white/5">
                             <h3 class="text-base font-semibold text-white mb-4 flex items-center justify-between">
                                <div class="flex items-center gap-2"><i data-lucide="image" class="w-5 h-5 text-emerald-400"></i> Ảnh Đại Diện</div>
                                <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                    <button type="button" onclick="setIconType('link')" id="btn-icon-link" class="text-xs px-3 py-1.5 rounded-md bg-cyan-500/20 text-cyan-400">Dán Link</button>
                                    <button type="button" onclick="setIconType('file')" id="btn-icon-file" class="text-xs px-3 py-1.5 rounded-md text-slate-400">Tải Lên</button>
                                </div>
                            </h3>
                            <div class="flex gap-4">
                                <div class="flex-1 flex flex-col justify-center">
                                    <div id="area-icon-link">
                                        <input type="text" id="icon-link-val" oninput="updateIconPreview()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" placeholder="Nhập link ảnh...">
                                    </div>
                                    <div id="area-icon-file" class="hidden-el">
                                        <input type="file" accept="image/*" id="icon-file-input" class="hidden" onchange="handleFileSelect(event, 'icon')">
                                        <button type="button" onclick="document.getElementById('icon-file-input').click()" class="w-full bg-slate-800 border border-slate-700 border-dashed rounded-xl py-3.5 flex items-center justify-center gap-2 text-slate-400 text-sm hover:text-cyan-400">
                                            <i data-lucide="image-plus" class="w-4 h-4"></i> Chọn ảnh
                                        </button>
                                    </div>
                                </div>
                                <div class="w-24 h-24 rounded-xl bg-slate-900 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-inner relative">
                                    <i data-lucide="image" id="icon-placeholder" class="w-8 h-8 text-slate-600"></i>
                                    <img id="icon-preview-img" src="" class="w-full h-full object-cover absolute inset-0 hidden-el" onerror="this.classList.add('hidden-el'); document.getElementById('icon-placeholder').classList.remove('hidden-el');">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-white/5 bg-slate-900/50 rounded-b-2xl flex justify-end gap-3">
                <button type="button" onclick="closeAdminPanel()" class="px-5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800">Hủy Bỏ</button>
                <button id="btn-save" form="resourceForm" type="submit" class="px-6 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Lưu Tài Nguyên
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT (TÍCH HỢP FIREBASE) -->
    <script type="module">
        // Import Firebase SDK (Module)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY (USER_FIREBASE_CONFIG)
        // Tạo project tại: https://console.firebase.google.com/ 
        // Bật Firestore Database (chế độ Production hoặc Test mode).
        // =========================================================================
        const firebaseConfig = {
		  apiKey: "AIzaSyALT8o8hQtVuSVn6A_hQSE4SvDHsg_y80I",
		  authDomain: "khotainguyen-5d8b8.firebaseapp.com",
		  projectId: "khotainguyen-5d8b8",
		  storageBucket: "khotainguyen-5d8b8.firebasestorage.app",
		  messagingSenderId: "345543974251",
		  appId: "1:345543974251:web:d9a1c177c8a686827ac02e",
		  measurementId: "G-X73FSSCR12"
		};
        // =========================================================================

        lucide.createIcons();

        // States
        let resources = [];
        let isAdmin = false;
        let currentUser = null;
        let currentResType = 'file';
        let currentIconType = 'link';
        let fileBase64 = '';
        let iconBase64 = '';
        
        // Setup Firebase config hỗ trợ cả môi trường động và môi trường của bạn
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : USER_FIREBASE_CONFIG;
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'kho-du-lieu-firebase-app';
        let db, auth;
        let isFirebaseActive = false;

        try {
            if(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseActive = true;
            }
        } catch (e) {
            console.warn("Chưa cấu hình Firebase hoặc cấu hình lỗi", e);
        }

        // --- HỆ THỐNG THÔNG BÁO TOAST ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400' : 'bg-red-500/20 border-red-500/50 text-red-400';
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';
            
            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-lg pointer-events-auto ${colors}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- KHỞI TẠO ---
        document.addEventListener('DOMContentLoaded', async () => { 
            // 1. Tải mượt từ Cache cục bộ trước tiên
            const cachedData = localStorage.getItem('kdl_resources');
            if(cachedData) {
                resources = JSON.parse(cachedData);
                renderResources();
            } else {
                document.getElementById('loading-state').classList.remove('hidden-el');
                document.getElementById('resources-grid').classList.add('hidden-el');
            }

            // 2. Khởi tạo xác thực Firebase
            if (isFirebaseActive) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    // 3. Lắng nghe dữ liệu theo thời gian thực (Real-time listener)
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            setupRealtimeListener();
                        }
                    });
                } catch (e) {
                    console.error("Lỗi xác thực Firebase", e);
                    showToast("Lỗi kết nối cơ sở dữ liệu", "error");
                    fallBackToMockData();
                }
            } else {
                fallBackToMockData();
            }
        });

        // --- FIREBASE REAL-TIME LISTENER ---
        function setupRealtimeListener() {
            if (!currentUser) return;
            const resourcesRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'resources');
            
            onSnapshot(resourcesRef, (snapshot) => {
                resources = [];
                snapshot.forEach((doc) => {
                    resources.push({ id: doc.id, ...doc.data() });
                });
                
                // Sắp xếp bài mới nhất lên trên
                resources.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                localStorage.setItem('kdl_resources', JSON.stringify(resources));
                renderResources();
            }, (error) => {
                console.error("Lỗi đồng bộ Firebase:", error);
                showToast("Mất kết nối với cơ sở dữ liệu", "error");
            });
        }

        function fallBackToMockData() {
            document.getElementById('loading-state').classList.add('hidden-el');
            if(resources.length === 0) {
                 document.getElementById('empty-state').classList.remove('hidden-el');
                 showToast("Đang chạy offline (chưa cấu hình Firebase).", "error");
            }
        }

        function renderResources() {
            document.getElementById('loading-state').classList.add('hidden-el');
            const grid = document.getElementById('resources-grid');
            
            if (resources.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden-el');
                grid.classList.add('hidden-el');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden-el');
            grid.classList.remove('hidden-el');
            grid.innerHTML = '';

            resources.forEach(res => {
                const isLink = res.type === 'link';
                const imgHtml = res.icon 
                    ? `<img src="${res.icon}" alt="${res.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-80 group-hover:opacity-100">`
                    : `<div class="w-full h-full flex items-center justify-center"><i data-lucide="file-box" class="w-12 h-12 text-slate-600"></i></div>`;

                let adminBtns = isAdmin ? `
                    <div class="flex gap-2">
                        <button onclick="openAdminPanel('${res.id}')" class="p-2 bg-slate-800 rounded-lg hover:text-amber-400 transition-colors border border-slate-700"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button onclick="handleDeleteResource('${res.id}')" class="p-2 bg-slate-800 rounded-lg hover:text-red-400 transition-colors border border-slate-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>` : '';

                grid.innerHTML += `
                    <div class="group bg-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden hover:border-cyan-500/50 transition-all flex flex-col shadow-lg">
                        <div class="h-40 overflow-hidden relative bg-slate-800">
                            ${imgHtml}
                            <div class="absolute top-2 right-2 bg-slate-950/80 px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-white/5">
                                <i data-lucide="${isLink ? 'link' : 'download'}" class="w-3 h-3 ${isLink ? 'text-blue-400' : 'text-emerald-400'}"></i> 
                                <span class="text-[10px] ${isLink ? 'text-blue-400' : 'text-emerald-400'} font-bold uppercase tracking-wider">${isLink ? 'Liên kết' : 'Tải về'}</span>
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            <h3 class="text-lg font-bold text-white mb-1">${res.title}</h3>
                            <p class="text-slate-400 text-sm mb-4 flex-1 line-clamp-2">${res.description || ''}</p>
                            <div class="flex items-center gap-2 mt-auto">
                                <button onclick="handleActionClick('${res.id}')" class="flex-1 bg-slate-800 hover:bg-cyan-600 text-white py-2 rounded-xl text-sm font-medium transition-colors flex items-center justify-center gap-2 border border-white/5 hover:border-cyan-500/50">
                                    <i data-lucide="${isLink ? 'external-link' : 'download'}" class="w-4 h-4"></i> ${isLink ? 'Mở Link' : 'Tải Về'}
                                </button>
                                ${adminBtns}
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- XỬ LÝ SỰ KIỆN TẢI VỀ / MỞ LINK ---
        window.handleActionClick = function(id) {
            const res = resources.find(r => r.id === id);
            if (!res) return;
            
            if (res.type === 'link' || (!res.url.startsWith('data:'))) {
                window.open(res.url, '_blank');
            } else {
                try {
                    const a = document.createElement('a');
                    a.href = res.url;
                    a.download = res.title;
                    document.body.appendChild(a); 
                    a.click(); 
                    document.body.removeChild(a);
                    showToast("Bắt đầu tải tệp tin");
                } catch(e) {
                    showToast("Lỗi khi tải tệp", "error");
                }
            }
        };

        // --- UI FORM ---
        window.setResType = function(type) {
            currentResType = type;
            document.getElementById('btn-type-file').className = `flex items-center justify-center gap-2 py-2.5 rounded-xl border text-sm transition-colors ${type==='file' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`;
            document.getElementById('btn-type-link').className = `flex items-center justify-center gap-2 py-2.5 rounded-xl border text-sm transition-colors ${type==='link' ? 'bg-blue-500/20 border-blue-500 text-blue-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`;
            
            document.getElementById('area-res-file').classList.toggle('hidden-el', type !== 'file');
            document.getElementById('area-res-link').classList.toggle('hidden-el', type !== 'link');
            if(type === 'link') document.getElementById('res-link-val').setAttribute('required', 'true');
            else document.getElementById('res-link-val').removeAttribute('required');
        };

        window.setIconType = function(type) {
            currentIconType = type;
            document.getElementById('btn-icon-link').className = `text-xs px-3 py-1.5 rounded-md transition-colors ${type==='link' ? 'bg-cyan-500/20 text-cyan-400' : 'text-slate-400 hover:bg-slate-700'}`;
            document.getElementById('btn-icon-file').className = `text-xs px-3 py-1.5 rounded-md transition-colors ${type==='file' ? 'bg-cyan-500/20 text-cyan-400' : 'text-slate-400 hover:bg-slate-700'}`;
            
            document.getElementById('area-icon-link').classList.toggle('hidden-el', type !== 'link');
            document.getElementById('area-icon-file').classList.toggle('hidden-el', type !== 'file');
            updateIconPreview();
        };

        function formatBytes(bytes) {
            if (!+bytes) return '0 Bytes';
            const k = 1024, i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${['Bytes', 'KB', 'MB', 'GB'][i]}`;
        }

        window.handleFileSelect = function(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Cảnh báo giới hạn (Firestore limit 1MB/document, base64 to ra 33%, nên set ~700KB an toàn)
            if(file.size > 700000 && type === 'file') {
                showToast("File quá lớn cho cơ sở dữ liệu. Vui lòng gắn link Drive!", "error");
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                if (type === 'file') {
                    fileBase64 = event.target.result;
                    const statusText = document.getElementById('file-status-text');
                    statusText.innerText = `Đã chọn: ${file.name} (${formatBytes(file.size)})`;
                    statusText.classList.add('text-emerald-400');
                } else if (type === 'icon') {
                    iconBase64 = event.target.result;
                    updateIconPreview();
                }
            };
            reader.readAsDataURL(file);
        };

        window.updateIconPreview = function() {
            const img = document.getElementById('icon-preview-img');
            const placeholder = document.getElementById('icon-placeholder');
            const src = currentIconType === 'link' ? document.getElementById('icon-link-val').value : iconBase64;
            if (src) {
                img.src = src; img.classList.remove('hidden-el'); placeholder.classList.add('hidden-el');
            } else {
                img.classList.add('hidden-el'); placeholder.classList.remove('hidden-el');
            }
        };

        // --- LƯU / XÓA LÊN FIREBASE ---
        window.handleSaveResource = async function(e) {
            e.preventDefault();
            const id = document.getElementById('res-id').value;
            const isEdit = !!id;
            
            if (currentResType === 'file' && !fileBase64 && !isEdit) { 
                showToast("Vui lòng chọn file upload!", "error"); return; 
            }

            const payload = {
                title: document.getElementById('res-title').value,
                description: document.getElementById('res-desc').value,
                type: currentResType,
                url: currentResType === 'link' ? document.getElementById('res-link-val').value : fileBase64,
                icon: currentIconType === 'link' ? document.getElementById('icon-link-val').value : iconBase64,
                createdAt: isEdit ? resources.find(r => r.id === id).createdAt : new Date().toISOString()
            };

            const btnSave = document.getElementById('btn-save');
            btnSave.disabled = true;
            btnSave.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Đang lưu...`;

            if (isFirebaseActive && currentUser) {
                try {
                    const docId = id || Date.now().toString();
                    const docRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'resources', docId);
                    await setDoc(docRef, payload);
                    showToast(isEdit ? "Cập nhật thành công!" : "Đã thêm tài nguyên mới!");
                } catch (err) { 
                    console.error("Lỗi Firebase:", err); 
                    showToast("Lỗi khi lưu lên Firebase", "error"); 
                }
            } else {
                // Offline Local test fallback
                payload.id = id || Date.now().toString();
                if (isEdit) resources = resources.map(r => r.id === payload.id ? payload : r);
                else resources.unshift(payload);
                localStorage.setItem('kdl_resources', JSON.stringify(resources));
                renderResources();
                showToast("Đã lưu (Chế độ Offline Local)");
            }
            
            btnSave.disabled = false;
            btnSave.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i> Lưu Tài Nguyên`;
            closeAdminPanel();
        };

        window.handleDeleteResource = async function(id) {
            if(!window.confirm("Bạn có chắc chắn muốn xóa tài nguyên này?")) return;
            
            if (isFirebaseActive && currentUser) {
                try {
                    showToast("Đang xóa...");
                    const docRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'resources', id);
                    await deleteDoc(docRef);
                    showToast("Đã xóa thành công");
                } catch (err) { 
                    console.error(err); 
                    showToast("Lỗi khi xóa", "error"); 
                }
            } else {
                resources = resources.filter(r => r.id !== id); 
                localStorage.setItem('kdl_resources', JSON.stringify(resources));
                renderResources();
                showToast("Đã xóa");
            }
        };

        // --- AUTH & MODAL ---
        window.openLoginModal = function() { document.getElementById('login-modal').classList.remove('hidden-el'); };
        window.closeLoginModal = function() { document.getElementById('login-modal').classList.add('hidden-el'); };
        
        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            // Admin default login (Mặc định: hung@admin.com / hung@123)
            if (email === 'hung@admin.com' && pass === 'hung@123') {
                isAdmin = true; closeLoginModal();
                document.getElementById('btn-login-trigger').classList.add('hidden-el');
                document.getElementById('admin-controls').classList.remove('hidden-el');
                
                // Reset fields
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';

                renderResources();
                showToast("Đăng nhập Admin thành công");
            } else {
                showToast("Tài khoản hoặc mật khẩu sai!", "error");
            }
        };

        window.handleLogout = function() {
            isAdmin = false;
            document.getElementById('btn-login-trigger').classList.remove('hidden-el');
            document.getElementById('admin-controls').classList.add('hidden-el');
            renderResources();
            showToast("Đã đăng xuất");
        };

        window.openAdminPanel = function(id = null) {
            document.getElementById('admin-panel-modal').classList.remove('hidden-el');
            document.getElementById('resourceForm').reset();
            fileBase64 = ''; iconBase64 = '';
            
            const fileStatusText = document.getElementById('file-status-text');
            fileStatusText.innerText = 'Khuyên dùng Link Drive cho file nặng';
            fileStatusText.className = 'text-xs text-slate-500 text-center px-2';
            
            if (id) {
                const res = resources.find(r => r.id === id);
                document.getElementById('modal-title').innerHTML = '<i data-lucide="edit" class="text-cyan-400 w-5 h-5"></i> Sửa Tài Nguyên';
                document.getElementById('res-id').value = res.id;
                document.getElementById('res-title').value = res.title;
                document.getElementById('res-desc').value = res.description;
                
                setResType(res.type);
                if (res.type === 'link') { document.getElementById('res-link-val').value = res.url; } 
                else { 
                    fileBase64 = res.url; 
                    fileStatusText.innerText = '✅ Đã có file lưu sẵn'; 
                    fileStatusText.className = 'text-xs text-emerald-400 text-center px-2';
                }

                if (res.icon && res.icon.startsWith('data:')) { setIconType('file'); iconBase64 = res.icon; } 
                else { setIconType('link'); document.getElementById('icon-link-val').value = res.icon || ''; }
            } else {
                document.getElementById('modal-title').innerHTML = '<i data-lucide="plus" class="text-cyan-400 w-5 h-5"></i> Thêm Tài Nguyên Mới';
                document.getElementById('res-id').value = '';
                setResType('file'); setIconType('link');
            }
            updateIconPreview(); lucide.createIcons();
        };

        window.closeAdminPanel = function() { document.getElementById('admin-panel-modal').classList.add('hidden-el'); };
    </script>
</body>
</html>
