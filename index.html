    function App() {
      const [tools, setTools] = React.useState([]);
      const [categories, setCategories] = React.useState([]);
      const [currentTab, setCurrentTab] = React.useState("Home");
      
      // Filter & Search states
      const [selectedCategory, setSelectedCategory] = React.useState("Tất cả");
      const [searchQuery, setSearchQuery] = React.useState("");
      const [sortBy, setSortBy] = React.useState("newest");
      
      // Active database configuration from GoFile
      const [currentDbCode, setCurrentDbCode] = React.useState("");
      const [shareableUrl, setShareableUrl] = React.useState("");
      const [syncLoading, setSyncLoading] = React.useState(false);

      // Admin auth state
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [showLoginModal, setShowLoginModal] = React.useState(false);
      const [adminEmail, setAdminEmail] = React.useState("");
      const [adminPassword, setAdminPassword] = React.useState("");
      
      // Feedback toast
      const [activeNotification, setActiveNotification] = React.useState(null);

      // Custom Delete Confirmation Modal state
      const [itemToDelete, setItemToDelete] = React.useState(null);

      const [newCategoryName, setNewCategoryName] = React.useState("");
      const [editingCategory, setEditingCategory] = React.useState(null);
      const [editCategoryInputValue, setEditCategoryInputValue] = React.useState("");

      // Tool form
      const [isEditing, setIsEditing] = React.useState(false);
      const [editToolId, setEditToolId] = React.useState(null);
      const [toolForm, setToolForm] = React.useState({
        name: "",
        description: "",
        category: "Windows",
        version: "v1.0.0",
        size: "",
        iconUrl: "",
        fileUrl: "",
        previewImage: "",
        featured: false,
        hidden: false
      });

      const [uploadMethods, setUploadMethods] = React.useState({
        file: "upload",
        icon: "link",
        preview: "link"
      });
      
      const [uploadingFile, setUploadingFile] = React.useState({
        active: false,
        percent: 0,
        targetField: null
      });

      const showToast = (message, type = "success") => {
        setActiveNotification({ message, type });
        setTimeout(() => setActiveNotification(null), 4000);
      };

      // Real synchronization download from GoFile Folder Code
      const fetchAndSyncFromGoFile = async (code) => {
        setSyncLoading(true);
        try {
          const res = await fetch(`https://api.gofile.io/contents/${code}?token=${GOFILE_ACCOUNT_TOKEN}`);
          if (!res.ok) throw new Error("GoFile API Error");
          const json = await res.json();
          if (json.status === "ok" && json.data.children) {
            const childrenList = Object.values(json.data.children);
            const dbFile = childrenList.find(f => f.name === "database.json");
            if (dbFile && dbFile.link) {
              const fileRes = await fetch(dbFile.link);
              if (!fileRes.ok) throw new Error("CORS or network error reading file");
              const importedTools = await fileRes.json();
              if (Array.isArray(importedTools)) {
                setTools(importedTools);
                localStorage.setItem("godownload_tools", JSON.stringify(importedTools));
                setCurrentDbCode(code);
                localStorage.setItem("godownload_active_db", code);
                // Update shareable link
                const origin = window.location.origin + window.location.pathname;
                setShareableUrl(`${origin}?db=${code}`);
                showToast("Đồng bộ dữ liệu thành công từ đám mây GoFile!");
              } else {
                throw new Error("Dữ liệu sai định dạng JSON array");
              }
            } else {
              throw new Error("Không tìm thấy file database.json");
            }
          } else {
            throw new Error("Mã GoFile không chính xác hoặc tệp đã bị xóa");
          }
        } catch (err) {
          console.error(err);
          showToast("Lỗi tải Database từ GoFile: " + err.message, "error");
        } finally {
          setSyncLoading(false);
        }
      };

      // Load database from localStorage & URL Params on startup
      React.useEffect(() => {
        // Load categories
        const localCats = localStorage.getItem("godownload_categories");
        if (localCats) {
          try {
            setCategories(JSON.parse(localCats));
          } catch(e) {
            const defaults = ["Tất cả", "Windows", "Office", "Network", "Design", "AI Tool", "Developer", "Driver", "Gaming", "Security", "Utility"];
            setCategories(defaults);
            localStorage.setItem("godownload_categories", JSON.stringify(defaults));
          }
        } else {
          const defaults = ["Tất cả", "Windows", "Office", "Network", "Design", "AI Tool", "Developer", "Driver", "Gaming", "Security", "Utility"];
          setCategories(defaults);
          localStorage.setItem("godownload_categories", JSON.stringify(defaults));
        }

        // Check synchronization from URL parameters `?db=CODE`
        const urlParams = new URLSearchParams(window.location.search);
        const dbCodeParam = urlParams.get('db');
        
        if (dbCodeParam) {
          fetchAndSyncFromGoFile(dbCodeParam);
        } else {
          // If no URL parameter, check saved local database code
          const savedDb = localStorage.getItem("godownload_active_db");
          if (savedDb) {
            fetchAndSyncFromGoFile(savedDb);
          } else {
            // No GoFile link, use standard localstorage
            const localData = localStorage.getItem("godownload_tools");
            if (localData) {
              try {
                setTools(JSON.parse(localData));
              } catch(e) {
                setTools(INITIAL_TOOLS);
                localStorage.setItem("godownload_tools", JSON.stringify(INITIAL_TOOLS));
              }
            } else {
              setTools(INITIAL_TOOLS);
              localStorage.setItem("godownload_tools", JSON.stringify(INITIAL_TOOLS));
            }
          }
        }
      }, []);

      // Synchronize database state helper
      const updateToolsDatabaseState = (newToolsList) => {
        setTools(newToolsList);
        localStorage.setItem("godownload_tools", JSON.stringify(newToolsList));
      };

      const updateCategoriesDatabaseState = (newCatsList) => {
        setCategories(newCatsList);
        localStorage.setItem("godownload_categories", JSON.stringify(newCatsList));
      };

      // Admin verification (hung@admin.com / hung@123)
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminEmail === "hung@admin.com" && adminPassword === "hung@123") {
          setIsAdmin(true);
          setShowLoginModal(false);
          setAdminEmail("");
          setAdminPassword("");

        setSyncLoading(true);
        showToast("Đang kết nối API để đồng bộ dữ liệu...", "info");

        try {
          const dbString = JSON.stringify(tools, null, 2);
          const blob = new Blob([dbString], { type: 'application/json' });
          const dbFile = new File([blob], 'database.json', { type: 'application/json' });

          // 1. Get GoFile Server
          const serverRes = await fetch('https://api.gofile.io/servers');
          if (!serverRes.ok) throw new Error("Mất kết nối máy chủ GoFile");
          const serverData = await serverRes.json();
          const serverName = serverData.data.servers[0].name;

          // 2. Upload file
          const formData = new FormData();
          formData.append('file', dbFile);
          formData.append('token', GOFILE_ACCOUNT_TOKEN);
          formData.append('accountId', GOFILE_ACCOUNT_ID);

          const uploadRes = await fetch(`https://${serverName}.gofile.io/contents/uploadfile`, {
            method: 'POST',
            body: formData
          });
          const uploadData = await uploadRes.json();

          if (uploadData.status === 'ok') {
            const code = uploadData.data.code;
            setCurrentDbCode(code);
            localStorage.setItem("godownload_active_db", code);

            const origin = window.location.origin + window.location.pathname;
            const newShareableUrl = `${origin}?db=${code}`;
            setShareableUrl(newShareableUrl);
            
            showToast("Xuất cấu hình & Đồng bộ lên GoFile thành công!");
          } else {
            throw new Error(uploadData.data?.message || "GoFile từ chối");
          }
        } catch (err) {
          console.error(err);
          showToast("Lỗi đồng bộ: " + err.message, "error");
        } finally {
          setSyncLoading(false);
        }
      };

      // Manual Import DB trigger inside Admin
      const handleManualImport = (e) => {
        e.preventDefault();
        if (!currentDbCode.trim()) return;
        
        let code = currentDbCode.trim();
        if (code.includes("/d/")) {
          code = code.split("/d/").pop().split("/").shift();
        }
        fetchAndSyncFromGoFile(code);
      };

      // GoFile Direct Upload Logic with User Credentials for Tool Files
      const handleGoFileUpload = async (event, targetField) => {
        const file = event.target.files[0];
        if (!file) return;

        setUploadingFile({ active: true, percent: 5, targetField });

        try {
          const serverRes = await fetch('https://api.gofile.io/servers');
          if (!serverRes.ok) throw new Error("CORS or network blockage");
          const serverData = await serverRes.json();
          const serverName = serverData.data.servers[0].name;

          const formData = new FormData();
          formData.append('file', file);
          formData.append('token', GOFILE_ACCOUNT_TOKEN);
          formData.append('accountId', GOFILE_ACCOUNT_ID);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', `https://${serverName}.gofile.io/contents/uploadfile`);
          
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              setUploadingFile(prev => ({ ...prev, percent: pct }));
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const response = JSON.parse(xhr.responseText);
                if (response.status === 'ok') {
                  const uploadedUrl = response.data.downloadPage;
                  const formattedSize = (file.size / (1024 * 1024)).toFixed(1) + " MB";
                  
                  setToolForm(prev => {
                    const update = { ...prev };
                    if (targetField === 'file') {
                      update.fileUrl = uploadedUrl;
                      update.size = formattedSize;
                      if (!update.name) {
                        update.name = file.name.split('.').slice(0, -1).join('.') || file.name;
                      }
                    }
                    if (targetField === 'icon') {
                      update.iconUrl = uploadedUrl;
                    }
                    if (targetField === 'preview') {
                      update.previewImage = uploadedUrl;
                    }
                    return update;
                  });

                  setUploadingFile({ active: false, percent: 100, targetField: null });
                  showToast(`Tải lên GoFile thành công! Kích thước: ${formattedSize}`);
                } else {
                  throw new Error();
                }
              } catch (err) {
                triggerSimulationFallback(file, targetField);
              }
            } else {
              triggerSimulationFallback(file, targetField);
            }
          };

          xhr.onerror = () => triggerSimulationFallback(file, targetField);
          xhr.send(formData);

        } catch (error) {
          triggerSimulationFallback(file, targetField);
        }
      };

      // Save/Edit tool logic
      const handleSaveTool = (e) => {
        e.preventDefault();
        if (!isAdmin) return showToast("Vui lòng đăng nhập Admin.", "error");
        if (!toolForm.name) return showToast("Vui lòng điền tên công cụ.", "error");
        if (!toolForm.fileUrl) return showToast("Vui lòng tải lên tệp tin cài đặt hoặc dán liên kết tải về.", "error");

        const documentPayload = {
          ...toolForm,
          downloads: toolForm.downloads || 0,
          rating: toolForm.rating || 5.0,
          updatedAt: Date.now()
        };

        let updatedList = [...tools];

        if (isEditing && editToolId) {
          updatedList = tools.map(t => t.id === editToolId ? { ...t, ...documentPayload } : t);
          showToast("Cập nhật Tool thành công!");
        } else {
          const newTool = {
            id: `tool-${Math.random().toString(36).substring(2, 9)}`,
            ...documentPayload,
            createdAt: Date.now()
          };
          updatedList = [newTool, ...tools];
          showToast("Thêm mới Tool thành công!");
        }

        updateToolsDatabaseState(updatedList);

        // Reset form
        setToolForm({
          name: "",
          description: "",
          category: categories[1] || "Windows",
          version: "v1.0.0",
          size: "",
          iconUrl: "",
          fileUrl: "",
          previewImage: "",
          featured: false,
          hidden: false
        });
        setIsEditing(false);
        setEditToolId(null);
      };

      const handleLoadEdit = (tool) => {
        setToolForm({
          name: tool.name,
          description: tool.description || "",
          category: tool.category,
          version: tool.version,
          size: tool.size,
          iconUrl: tool.iconUrl || "",
          fileUrl: tool.fileUrl,
          previewImage: tool.previewImage || "",
          featured: tool.featured || false,
          hidden: tool.hidden || false,
          downloads: tool.downloads,
          rating: tool.rating,
          createdAt: tool.createdAt
        });
        setIsEditing(true);
        setEditToolId(tool.id);
        
        setUploadMethods({
          file: tool.fileUrl ? "link" : "upload",
          icon: tool.iconUrl ? "link" : "upload",
          preview: tool.previewImage ? "link" : "upload"
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Safe Delete Handler
      const handleConfirmDelete = () => {
        if (!itemToDelete) return;
        const updatedList = tools.filter(t => t.id !== itemToDelete);
        updateToolsDatabaseState(updatedList);
        setItemToDelete(null);
        showToast("Đã xóa công cụ thành công!");
      };

      const handleToggleHide = (tool) => {
        const updatedList = tools.map(t => t.id === tool.id ? { ...t, hidden: !t.hidden } : t);
        updateToolsDatabaseState(updatedList);
        showToast(tool.hidden ? "Đã hiển thị lại công cụ!" : "Đã ẩn công cụ khỏi trang chủ!");
      };

      const handleToggleFeatured = (tool) => {
        const updatedList = tools.map(t => t.id === tool.id ? { ...t, featured: !t.featured } : t);
        updateToolsDatabaseState(updatedList);
        showToast(tool.featured ? "Đã tắt nhãn nổi bật" : "Đã gắn nhãn nổi bật thành công!");
      };

      // Direct Immediate download bypass logic
      const triggerDownload = (tool) => {
        const updatedList = tools.map(t => t.id === tool.id ? { ...t, downloads: (t.downloads || 0) + 1 } : t);
        updateToolsDatabaseState(updatedList);
        showToast("Đang chuẩn bị luồng tải tốc độ cao từ GoFile...");
        setTimeout(() => {
          window.open(tool.fileUrl, '_blank');
        }, 800);
      };

      // ADD NEW CATEGORY
      const handleAddCategory = (e) => {
        e.preventDefault();
        const trimmedName = newCategoryName.trim();
        if (!trimmedName) return;

        const alreadyExists = categories.some(cat => cat.toLowerCase() === trimmedName.toLowerCase());
        if (alreadyExists) {
          showToast("Danh mục này đã tồn tại!", "error");
          return;
        }

        const updatedCategories = [...categories, trimmedName];
        updateCategoriesDatabaseState(updatedCategories);
        setNewCategoryName("");
        showToast(`Đã thêm danh mục '${trimmedName}' thành công!`);
      };

      // START EDITING CATEGORY MODE
      const handleStartEditCategory = (cat) => {
        if (cat === "Tất cả") {
          showToast("Không thể chỉnh sửa danh mục hệ thống 'Tất cả'!", "error");
          return;
        }
        setEditingCategory(cat);
        setEditCategoryInputValue(cat);
      };

      // SAVE CATEGORY EDIT
      const handleSaveCategoryEdit = (e) => {
        e.preventDefault();
        const trimmedNewName = editCategoryInputValue.trim();
        if (!trimmedNewName || !editingCategory) return;

        if (trimmedNewName === editingCategory) {
          setEditingCategory(null);
          return;
        }

        const alreadyExists = categories.some(cat => cat.toLowerCase() === trimmedNewName.toLowerCase() && cat !== editingCategory);
        if (alreadyExists) {
          showToast("Tên danh mục mới này đã tồn tại!", "error");
          return;
        }

        const updatedCategories = categories.map(cat => cat === editingCategory ? trimmedNewName : cat);
        updateCategoriesDatabaseState(updatedCategories);

        const updatedToolsList = tools.map(tool => {
          if (tool.category === editingCategory) {
            return { ...tool, category: trimmedNewName };
          }
          return tool;
        });
        updateToolsDatabaseState(updatedToolsList);

        setEditingCategory(null);
        setEditCategoryInputValue("");
        showToast(`Đã đổi tên danh mục và cập nhật các công cụ liên quan!`);
      };

      // DELETE CATEGORY WITH SAFETY CHECKS
      const handleDeleteCategory = (catToDelete) => {
        if (catToDelete === "Tất cả") {
          showToast("Không thể xóa danh mục hệ thống 'Tất cả'!", "error");
          return;
        }

        const isCurrentlyUsed = tools.some(tool => tool.category === catToDelete);
        if (isCurrentlyUsed) {
          showToast(`Không thể xóa! Có tài nguyên đang thuộc danh mục '${catToDelete}'.`, "error");
          return;
        }

        const updatedCategories = categories.filter(cat => cat !== catToDelete);
        updateCategoriesDatabaseState(updatedCategories);
        showToast(`Đã xóa danh mục '${catToDelete}' thành công!`);
      };

      // Copy Shareable URL helper
      const copyToClipboard = () => {
        if (!shareableUrl) return;
        const input = document.createElement('textarea');
        input.value = shareableUrl;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast("Đã copy liên kết đồng bộ vào bộ nhớ tạm!");
      };

      // Filtration and Sorting algorithms
      const filteredAndSortedTools = tools
        .filter(t => {
          if (isAdmin) return true;
          return !t.hidden;
        })
        .filter(t => {
          if (selectedCategory === "Tất cả") return true;
          return t.category.toLowerCase() === selectedCategory.toLowerCase();
        })
        .filter(t => {
          const query = searchQuery.toLowerCase();
          return t.name.toLowerCase().includes(query) || (t.description && t.description.toLowerCase().includes(query));
        })
        .sort((a, b) => {
          if (sortBy === "downloads") return (b.downloads || 0) - (a.downloads || 0);
          if (sortBy === "featured") return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

      return (
        <div className="relative min-h-screen pb-16 bg-slate-100 text-slate-800">
          <div className="glow-bg-1"></div>
          <div className="glow-bg-2"></div>

          {/* Toast Notification */}
          {activeNotification && (
            <div className={`fixed bottom-6 right-6 z-50 glassmorphism p-4 rounded-xl flex items-center space-x-3 shadow-2xl transition-all border-l-4 ${activeNotification.type === 'error' ? 'border-l-red-500' : 'border-l-blue-500'}`}>
              <div className="text-slate-800 text-sm font-semibold">{activeNotification.message}</div>
              <button onClick={() => setActiveNotification(null)} className="text-slate-400 hover:text-slate-600">
                <Icons.Close />
              </button>
            </div>
          )}

          {/* Custom Delete Confirmation Modal */}
          {itemToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md">
              <div className="w-full max-w-sm glassmorphism rounded-2xl p-6 border border-slate-200/50 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900 mb-2">Xác nhận xóa tệp</h3>
                <p className="text-sm text-slate-500 mb-6">Bạn có chắc chắn muốn xóa vĩnh viễn tài nguyên này khỏi cơ sở dữ liệu cục bộ không?</p>
                <div className="flex space-x-3">
                  <button 
                    onClick={() => setItemToDelete(null)}
                    className="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600 rounded-lg transition">
                    Hủy bỏ
                  </button>
                  <button 
                    onClick={handleConfirmDelete}
                    className="w-1/2 py-2 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-lg transition shadow-lg shadow-red-500/20">
                    Xác nhận xóa
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 1. HEADER (Newly Styled Logo and Header Text) */}
          <header className="sticky top-0 z-40 w-full bg-white/80 backdrop-blur-md border-b border-slate-200/80">
            <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* Logo & Slogan */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentTab("Home")}>
                <Icons.Logo />
                <div>
                  <h1 className="text-base font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-orange-500">
                    Kho Tài Nguyên
                  </h1>
                  <p className="text-[10px] text-slate-400 font-bold tracking-wider uppercase">Direct Cloud Platform</p>
                </div>
              </div>

              {/* Minimalist Navigation Menu */}
              <nav className="flex space-x-6 text-xs font-semibold">
                <button 
                  onClick={() => { setCurrentTab("Home"); setSelectedCategory("Tất cả"); }} 
                  className={`transition ${currentTab === "Home" ? "text-blue-600 font-bold" : "text-slate-500 hover:text-slate-900"}`}>
                  Trang chủ
                </button>
                {isAdmin && (
                  <button 
                    onClick={() => setCurrentTab("Admin")} 
                    className={`transition flex items-center space-x-1 ${currentTab === "Admin" ? "text-orange-600 font-bold" : "text-slate-500 hover:text-slate-900"}`}>
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>Admin Panel</span>
                  </button>
                )}
              </nav>

              {/* Right Login/Logout Actions */}
              <div className="flex items-center space-x-4">
                {isAdmin ? (
                  <button 
                    onClick={() => { setIsAdmin(false); setCurrentTab("Home"); showToast("Đã thoát tài khoản Admin."); }} 
                    className="px-3 py-1.5 text-[11px] font-bold text-red-500 border border-red-200 rounded-lg hover:bg-red-50 transition">
                    Thoát Admin
                  </button>
                ) : (
                  <button 
                    onClick={() => setShowLoginModal(true)} 
                    className="flex items-center space-x-1.5 px-3.5 py-1.5 text-[11px] font-bold bg-white border border-slate-200 text-blue-600 shadow-sm rounded-lg hover:bg-slate-50 transition">
                    <Icons.Admin />
                    <span>Đăng nhập</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* 2. MARQUEE NOTIFICATION BAR (Double Speed, No Hover Pause - Bright Styling) */}
          <div className="w-full bg-blue-50/70 border-b border-blue-100 py-2.5 overflow-hidden relative">
            <div className="animate-marquee-fast flex space-x-16 items-center">
              <span className="flex items-center space-x-2 text-xs text-blue-700 font-semibold">
                <Icons.Fire />
                <span>[MỚI] Hỗ trợ đồng bộ hóa tệp dữ liệu tự động giữa các máy tính khác nhau thông qua link tham số db.</span>
              </span>
              <span className="flex items-center space-x-2 text-xs text-orange-700 font-semibold">
                <Icons.Fire />
                <span>Chào mừng quý khách đến với Kho Tài Nguyên. Tải xuống an toàn, sạch sẽ, bảo mật cao.</span>
              </span>
              <span className="flex items-center space-x-2 text-xs text-blue-700 font-semibold">
                <Icons.Fire />
                <span>Không giới hạn tốc độ băng thông - Lưu trữ đám mây qua hệ thống API GoFile.</span>
              </span>
            </div>
          </div>

          {/* Cloud Database Sync Status Indicator (Header Status Bar) */}
          {currentDbCode && (
            <div className="w-full bg-slate-200/50 border-b border-slate-200 py-1.5 text-center text-[10px] text-slate-500 flex items-center justify-center space-x-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Đang đồng bộ từ GoFile: <strong>gofile.io/d/{currentDbCode}</strong></span>
              <button 
                onClick={() => {
                  fetchAndSyncFromGoFile(currentDbCode);
                }}
                className="text-blue-600 hover:underline font-bold"
                title="Tải lại bản mới nhất từ GoFile">
                [Tải lại dữ liệu]
              </button>
            </div>
          )}

          {/* Main App Container */}
          <main className="max-w-5xl mx-auto px-4 mt-10">

            {currentTab === "Home" ? (
              <div className="min-h-[500px]">
                {/* SEARCH PANEL WITH INTUITIVE LIGHT DESIGN */}
                <div className="mb-10 max-w-2xl mx-auto">
                  <div className="bg-white p-2 rounded-2xl flex items-center border border-slate-200/80 shadow-md">
                    <div className="pl-3 text-slate-400">
                      <Icons.Search />
                    </div>
                    <input 
                      type="text" 
                      placeholder="Tìm kiếm nhanh phần mềm, ứng dụng, tài nguyên..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-transparent border-0 px-3 py-2 focus:outline-none focus:ring-0 text-slate-800 text-sm"
                    />
                    {searchQuery && (
                      <button 
                        onClick={() => setSearchQuery("")} 
                        className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600 mr-1">
                        <Icons.Close />
                      </button>
                    )}
                  </div>
                </div>

                {/* CATEGORIES & SORT PANEL */}
                <div className="mb-8">
                  <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center space-y-4 lg:space-y-0 pb-4 border-b border-slate-200">
                    
                    {/* Horizontal scrollable category list with absolute anti-shifting */}
                    <div className="flex items-center space-x-1.5 overflow-x-auto w-full lg:w-auto pb-2 lg:pb-0 scrollbar-none">
                      {categories.map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-3.5 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap transition-all flex-shrink-0 border ${
                            selectedCategory === cat 
                              ? 'bg-blue-600 text-white border-blue-600' 
                              : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                          }`}>
                          {cat}
                        </button>
                      ))}
                    </div>

                    {/* Sorting selector */}
                    <div className="flex items-center space-x-2.5 w-full lg:w-auto justify-end">
                      <span className="text-[11px] text-slate-400 uppercase font-bold tracking-wider">Sắp xếp:</span>
                      <select 
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-[11px] font-bold text-slate-600 focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="newest">Mới cập nhật</option>
                        <option value="downloads">Lượt tải nhiều</option>
                        <option value="featured">Khuyên dùng</option>
                      </select>
                    </div>

                  </div>
                </div>

                {/* GRID DASHBOARD OF TOOLS */}
                {filteredAndSortedTools.length === 0 ? (
                  <div className="text-center py-20 bg-white border border-slate-200 rounded-2xl shadow-sm">
                    <p className="text-slate-500 text-xs">Không tìm thấy tài nguyên nào phù hợp với từ khóa.</p>
                  </div>
                ) : (
                  <div>
                    <h3 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest mb-6 flex items-center space-x-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                      <span>DANH SÁCH TÀI NGUYÊN HIỆN CÓ ({filteredAndSortedTools.length})</span>
                    </h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      {filteredAndSortedTools.map((tool) => (
                        <div 
                          key={tool.id} 
                          className="bg-white border border-slate-200/80 rounded-2xl p-4 transition-all duration-300 flex flex-col justify-between group relative overflow-hidden hover:border-blue-500/50 hover:shadow-[0_0_12px_rgba(37,99,235,0.06),_0_0_8px_rgba(249,115,22,0.04)]">
                          
                          {tool.featured && (
                            <div className="absolute top-0 left-0 w-full h-1 bg-blue-600"></div>
                          )}

                          <div>
                            {/* Card Header Info */}
                            <div className="flex items-start justify-between mb-3">
                              <div className="flex items-center space-x-3">
                                <img 
                                  src={tool.iconUrl || 'https://images.unsplash.com/photo-1618401471353-b98aedd07871?auto=format&fit=crop&w=120&q=80'} 
                                  alt={tool.name} 
                                  className="w-9 h-9 rounded-xl object-cover border border-slate-100 flex-shrink-0"
                                  onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1618401471353-b98aedd07871?auto=format&fit=crop&w=120&q=80' }}
                                />
                                <div>
                                  <span className="px-2 py-0.5 rounded text-[9px] font-bold bg-blue-50 text-blue-600 border border-blue-100 uppercase">
                                    {tool.category}
                                  </span>
                                  <h4 className="font-extrabold text-slate-800 mt-1 line-clamp-1 text-sm">{tool.name}</h4>
                                </div>
                              </div>

                              {tool.featured && (
                                <span className="text-[8px] uppercase font-extrabold px-1.5 py-0.5 rounded bg-orange-50 text-orange-600 border border-orange-100 flex-shrink-0">HOT</span>
                              )}
                            </div>

                            {/* Short Description */}
                            <p className="text-xs text-slate-500 line-clamp-2 mb-3 leading-relaxed">
                              {tool.description || 'Không có mô tả bổ sung cho tài nguyên này.'}
                            </p>

                            {/* Preview Image */}
                            {tool.previewImage && (

                            type="text"
                            required
                            placeholder={editingCategory ? `Đang sửa: ${editingCategory}` : "Tên danh mục mới..."}
                            value={editingCategory ? editCategoryInputValue : newCategoryName}
                            onChange={(e) => editingCategory ? setEditCategoryInputValue(e.target.value) : setNewCategoryName(e.target.value)}
                            className="flex-1 px-3 py-1.5 glass-input rounded-xl text-xs focus:outline-none"
                          />
                          <button 
                            type="submit"
                            className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white rounded-xl shadow-md transition flex-shrink-0">
                            {editingCategory ? "Lưu" : "Thêm"}
                          </button>
                          {editingCategory && (
                            <button 
                              type="button"
                              onClick={() => { setEditingCategory(null); setEditCategoryInputValue(""); }}
                              className="px-2 py-1.5 bg-slate-200 hover:bg-slate-300 text-xs font-bold text-slate-600 rounded-xl transition">
                              Hủy
                            </button>
                          )}
                        </div>
                      </form>

                      {/* CATEGORIES LISTING WITH ACTIONS */}
                      <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                        {categories.map((cat) => (
                          <div 
                            key={cat} 
                            className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200/60 hover:bg-white transition-colors duration-150">
                            <span className="text-xs font-bold text-slate-700">{cat}</span>
                            
                            {cat !== "Tất cả" && (
                              <div className="flex items-center space-x-1">
                                <button 
                                  onClick={() => handleStartEditCategory(cat)}
                                  className="p-1 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                  title="Chỉnh sửa danh mục">
                                  <Icons.Edit />
                                </button>
                                <button 
                                  onClick={() => handleDeleteCategory(cat)}
                                  className="p-1 text-red-600 hover:bg-red-50 rounded-lg transition"
                                  title="Xóa danh mục">
                                  <Icons.Trash />
                                </button>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>

                      <div className="mt-4 text-[10px] text-slate-400 italic">
                        * Chú ý: Danh mục "Tất cả" là mặc định hệ thống. Khi chỉnh sửa danh mục khác, toàn bộ tài nguyên tương ứng sẽ tự động cập nhật đồng bộ.
                      </div>
                    </div>

                  </div>

                </div>

                {/* 7. DATABASE MANAGEMENT TABLE */}
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden mt-6 shadow-sm">
                  <div className="p-5 border-b border-slate-100">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-blue-600 flex items-center space-x-2">
                      <Icons.Home />
                      <span>Danh Sách Quản Lý Cơ Sở Dữ Liệu</span>
                    </h3>
                  </div>

                  <div className="overflow-x-auto w-full">
                    <table className="w-full text-left text-xs text-slate-500">
                      <thead className="text-[10px] uppercase tracking-wider bg-slate-50 text-slate-400 font-extrabold border-b border-slate-200/80">
                        <tr>
                          <th className="py-3.5 px-5">ICON</th>
                          <th className="py-3.5 px-5">TÊN TÀI NGUYÊN</th>
                          <th className="py-3.5 px-5">DANH MỤC</th>
                          <th className="py-3.5 px-5">VERSION</th>
                          <th className="py-3.5 px-5">DOWNLOADS</th>
                          <th className="py-3.5 px-5 text-right">THAO TÁC</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {tools.map((tool) => (
                          <tr key={tool.id} className="hover:bg-slate-50/50 transition-colors">
                            <td className="py-3.5 px-5">
                              <img 
                                src={tool.iconUrl || 'https://images.unsplash.com/photo-1618401471353-b98aedd07871?auto=format&fit=crop&w=120&q=80'} 
                                alt="Icon" 
                                className="w-8 h-8 rounded-lg object-cover border border-slate-100"
                              />
                            </td>
                            <td className="py-3.5 px-5 font-bold text-slate-800">
                              <div>{tool.name}</div>
                              <div className="flex space-x-1.5 mt-1">
                                {tool.featured && <span className="px-1.5 py-0.5 rounded text-[8px] bg-orange-50 text-orange-600 border border-orange-100 font-bold">HOT</span>}
                                {tool.hidden && <span className="px-1.5 py-0.5 rounded text-[8px] bg-red-50 text-red-600 border border-red-100 font-bold">ẨN</span>}
                              </div>
                            </td>
                            <td className="py-3.5 px-5 text-[11px] font-semibold">{tool.category}</td>
                            <td className="py-3.5 px-5 text-[11px] text-blue-600 font-extrabold">{tool.version}</td>
                            <td className="py-3.5 px-5 text-[11px] font-bold text-slate-600">{tool.downloads || 0} Lượt</td>
                            <td className="py-3.5 px-5 text-right">
                              <div className="flex items-center justify-end space-x-1">
                                
                                <button 
                                  onClick={() => handleToggleFeatured(tool)} 
                                  title="Đánh dấu nổi bật"
                                  className={`p-1.5 rounded transition ${tool.featured ? 'text-amber-500 hover:bg-amber-50' : 'text-slate-400 hover:text-slate-800'}`}>
                                  <Icons.Star filled={tool.featured} />
                                </button>
                                
                                <button 
                                  onClick={() => handleToggleHide(tool)} 
                                  title={tool.hidden ? "Hiện tool" : "Ẩn tool"}
                                  className={`p-1.5 rounded transition ${tool.hidden ? 'text-red-500 hover:bg-red-50' : 'text-slate-400 hover:text-slate-800'}`}>
                                  {tool.hidden ? <Icons.EyeOff /> : <Icons.Eye />}
                                </button>

                                <button 
                                  onClick={() => handleLoadEdit(tool)} 
                                  title="Sửa thông tin"
                                  className="p-1.5 rounded text-blue-600 hover:text-blue-700 hover:bg-blue-50 transition">
                                  <Icons.Edit />
                                </button>

                                <button 
                                  onClick={() => setItemToDelete(tool.id)} 
                                  title="Xóa vĩnh viễn"
                                  className="p-1.5 rounded text-red-600 hover:text-red-700 hover:bg-red-50 transition">
                                  <Icons.Trash />
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="mt-20 border-t border-slate-200 pt-8 max-w-5xl mx-auto px-4 text-center text-xs text-slate-400 font-semibold">
            <p>© 2026 Kho Tài Nguyên Platform. Tối ưu hóa lưu trữ đám mây qua hệ thống GoFile API.</p>
          </footer>

          {/* MODAL 1: REDESIGNED ADMIN LOGIN FORM (No Suggestion Hints) */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="w-full max-w-md glassmorphism rounded-2xl p-6 relative border border-slate-200 shadow-2xl">
                <button 
                  onClick={() => {
                    setShowLoginModal(false);
                    setAdminEmail("");
                    setAdminPassword("");
                  }} 
                  className="absolute top-4 right-4 p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-white transition">
                  <Icons.Close />
                </button>

                <div className="flex items-center space-x-3 mb-6">
                  <div className="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
                    <Icons.Lock />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900">Đăng Nhập Quản Trị Viên</h3>
                    <p className="text-[11px] text-slate-500">Vui lòng điền Email và mật khẩu quản trị để tiếp tục.</p>
                  </div>
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-4" autoCorrect="off" autoCapitalize="off" autoComplete="off">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Email quản trị *</label>
                    <input 
                      type="email" 
                      required
                      placeholder="Email quản trị" 
                      value={adminEmail}
                      onChange={(e) => setAdminEmail(e.target.value)}
                      className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs"
                      autoComplete="new-email"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mật khẩu *</label>
                    <input 
                      type="password" 
                      required
                      placeholder="Mật khẩu" 
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs"
                      autoComplete="new-password"
                    />
                  </div>

                  <button 
                    type="submit" 
                    className="w-full py-2.5 mt-2 bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white rounded-xl transition duration-150 shadow-md">
                    Xác nhận thông tin
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
