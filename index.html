<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Dữ Liệu</title>
    <!-- Favicon SVG tích hợp trực tiếp -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v11'/><path d='M8 7l4-4 4 4'/><path d='M12 21V10'/><path d='M8 17l4 4 4-4'/><path d='M4 12h2'/><path d='M18 12h2'/></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho bảng admin */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Ẩn phần tử */
        .hidden-el { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-cyan-500/30 min-h-screen relative">

    <!-- Background glow effects -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-600/20 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/20 blur-[120px]"></div>
    </div>

    <!-- HEADER (Nâng z-index lên 40 để luôn nằm trên cùng) -->
    <header class="relative z-40 border-b border-white/10 bg-slate-900/80 backdrop-blur-md sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="relative group flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all duration-300 hover:shadow-[0_0_30px_rgba(6,182,212,0.8)] hover:scale-105">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 drop-shadow-md">
                        <path d="M12 3v11"></path>
                        <path d="M8 7l4-4 4 4"></path>
                        <path d="M12 21V10"></path>
                        <path d="M8 17l4 4 4-4"></path>
                        <path d="M4 12h2"></path>
                        <path d="M18 12h2"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)] tracking-wide">
                    Kho Dữ Liệu
                </h1>
            </div>

            <!-- Admin Controls -->
            <div id="auth-container">
                <button onclick="openLoginModal()" id="btn-login-trigger" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-colors text-sm">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Admin
                </button>
                
                <div id="admin-controls" class="hidden-el flex items-center gap-3">
                    <button onclick="openAdminPanel()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/20 hover:shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all duration-300 text-sm font-medium">
                        <i data-lucide="plus" class="w-4 h-4"></i> Thêm Tài Nguyên
                    </button>
                    <button onclick="handleLogout()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-colors text-sm">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Thoát
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Banner thu nhỏ để nhường chỗ cho dashboard -->
        <div class="text-center mb-8">
            <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                Khám phá & Lưu trữ <span class="text-cyan-400">Tài nguyên</span>
            </h2>
            <p class="text-slate-400 text-base max-w-2xl mx-auto">
                Hệ thống quản lý, chia sẻ tài liệu trực tuyến.
            </p>
        </div>

        <!-- Trạng thái Loading / Lưới dữ liệu -->
        <div id="loading-state" class="flex justify-center items-center py-10">
            <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        
        <div id="empty-state" class="hidden-el text-center py-20 flex flex-col items-center opacity-60">
            <i data-lucide="database" class="w-16 h-16 mb-4 text-slate-500"></i>
            <p class="text-lg">Kho dữ liệu hiện đang trống.</p>
        </div>

        <div id="resources-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden-el">
            <!-- Render dữ liệu bằng JS -->
        </div>
    </main>

    <!-- ========================================== -->
    <!-- MODALS -->
    <!-- ========================================== -->

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden-el">
        <div class="bg-slate-900 border border-slate-700/50 rounded-2xl w-full max-w-md p-8 relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                    <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Admin Login</h2>
                <p class="text-slate-400 text-sm mt-1">Đăng nhập để quản lý tài nguyên</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Email (hung@admin.com)</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" placeholder="Nhập email...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu (hung@123)</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" placeholder="Nhập mật khẩu...">
                </div>
                
                <div id="login-error" class="hidden-el flex items-center gap-2 text-red-400 text-sm bg-red-500/10 p-3 rounded-lg border border-red-500/20">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i> <span id="login-error-text"></span>
                </div>

                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] transition-all duration-300 mt-6">
                    Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel (Thêm/Sửa Tài Nguyên) - Mở rộng width và chia 2 cột -->
    <div id="admin-panel-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden-el overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700/50 rounded-2xl w-full max-w-4xl my-8 relative shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col max-h-[90vh]">
            
            <div class="flex items-center justify-between p-5 border-b border-white/5">
                <h2 id="modal-title" class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus" class="text-cyan-400 w-5 h-5"></i> Thêm Tài Nguyên Mới
                </h2>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg hover:bg-slate-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
                <form id="resourceForm" onsubmit="handleSaveResource(event)">
                    <input type="hidden" id="res-id">
                    
                    <!-- Hàng 1: Thông tin chung -->
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Tên tài nguyên <span class="text-red-400">*</span></label>
                            <input type="text" id="res-title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" placeholder="Ví dụ: Tool Download Video">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Mô tả ngắn</label>
                            <textarea id="res-desc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 resize-none" placeholder="Mô tả công dụng tài nguyên này..."></textarea>
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full mb-6"></div>

                    <!-- Hàng 2: Bố cục 2 cột cho Tài nguyên & Icon -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <!-- Cột Trái: Upload Tài Nguyên -->
                        <div class="bg-slate-800/30 p-5 rounded-2xl border border-white/5">
                            <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
                                <i data-lucide="file-box" class="w-5 h-5 text-cyan-400"></i> Nguồn Tài Nguyên
                            </h3>
                            <div class="grid grid-cols-2 gap-2 mb-4">
                                <button type="button" onclick="setResType('file')" id="btn-type-file" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-cyan-500/20 border-cyan-500 text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.2)] text-sm">
                                    <i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload File
                                </button>
                                <button type="button" onclick="setResType('link')" id="btn-type-link" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700 text-sm">
                                    <i data-lucide="link" class="w-4 h-4"></i> Gắn Link
                                </button>
                            </div>

                            <!-- Khu vực File -->
                            <div id="area-res-file" class="p-6 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800/50 hover:bg-slate-800 transition-colors h-[120px] flex items-center justify-center">
                                <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event, 'file')">
                                <div class="flex flex-col items-center justify-center text-center cursor-pointer w-full h-full" onclick="document.getElementById('file-input').click()">
                                    <i data-lucide="upload-cloud" class="w-8 h-8 text-cyan-400 mb-2"></i>
                                    <span class="text-sm font-medium text-slate-300 mb-1">Click để chọn file</span>
                                    <span id="file-status-text" class="text-xs text-slate-500 text-center px-2 line-clamp-2">Hỗ trợ tự động đọc dung lượng</span>
                                </div>
                            </div>

                            <!-- Khu vực Link -->
                            <div id="area-res-link" class="hidden-el h-[120px]">
                                <label class="block text-sm text-slate-400 mb-2">Đường dẫn liên kết:</label>
                                <input type="url" id="res-link-val" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" placeholder="https://drive.google.com/...">
                            </div>
                        </div>

                        <!-- Cột Phải: Upload Icon -->
                        <div class="bg-slate-800/30 p-5 rounded-2xl border border-white/5">
                             <h3 class="text-base font-semibold text-white mb-4 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="image" class="w-5 h-5 text-emerald-400"></i> Ảnh Đại Diện
                                </div>
                                <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                    <button type="button" onclick="setIconType('link')" id="btn-icon-link" class="text-xs px-3 py-1.5 rounded-md bg-cyan-500/20 text-cyan-400 transition-colors">Dán Link</button>
                                    <button type="button" onclick="setIconType('file')" id="btn-icon-file" class="text-xs px-3 py-1.5 rounded-md text-slate-400 hover:bg-slate-700 transition-colors">Tải Lên</button>
                                </div>
                            </h3>

                            <div class="flex gap-4">
                                <!-- Khung nhập liệu (Link hoặc Nút File) -->
                                <div class="flex-1 flex flex-col justify-center">
                                    <!-- Icon dạng Link -->
                                    <div id="area-icon-link">
                                        <input type="text" id="icon-link-val" oninput="updateIconPreview()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-sm" placeholder="Nhập link ảnh...">
                                    </div>
                                    <!-- Icon dạng File -->
                                    <div id="area-icon-file" class="hidden-el">
                                        <input type="file" accept="image/*" id="icon-file-input" class="hidden" onchange="handleFileSelect(event, 'icon')">
                                        <button type="button" onclick="document.getElementById('icon-file-input').click()" class="w-full bg-slate-800 border border-slate-700 border-dashed rounded-xl py-3.5 flex items-center justify-center gap-2 text-slate-400 hover:text-cyan-400 hover:border-cyan-500/50 transition-colors text-sm">
                                            <i data-lucide="image-plus" class="w-4 h-4"></i> Chọn ảnh từ máy tính
                                        </button>
                                    </div>
                                </div>

                                <!-- Khung Preview vuông bên cạnh -->
                                <div class="w-24 h-24 rounded-xl bg-slate-900 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-inner relative">
                                    <i data-lucide="image" id="icon-placeholder" class="w-8 h-8 text-slate-600"></i>
                                    <img id="icon-preview-img" src="" alt="Preview" class="w-full h-full object-cover absolute inset-0 hidden-el" onerror="this.classList.add('hidden-el'); document.getElementById('icon-placeholder').classList.remove('hidden-el');">
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>

            <div class="p-5 border-t border-white/5 bg-slate-900/50 rounded-b-2xl flex justify-end gap-3">
                <button type="button" onclick="closeAdminPanel()" class="px-5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800 transition-colors">
                    Hủy Bỏ
                </button>
                <button form="resourceForm" type="submit" class="px-6 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] transition-all flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Lưu Tài Nguyên
                </button>
            </div>
            
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- ========================================== -->
    <script>
        lucide.createIcons();

        // --- CẤU HÌNH GOOGLE APPS SCRIPT ---
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwV_WiInIhlkd_KyRat2bOK9LcVV7ZdMKmEFr_FPqui-3yz_813XIkIGlHL37JZa349Jw/exec"; 

        // --- DỮ LIỆU MẪU ---
        const initialMockData = [
            { id: "1", title: "Tài liệu ReactJS Nâng Cao", description: "Bộ tài liệu học React chuẩn", type: "file", url: "https://example.com/react-doc.pdf", icon: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=200&auto=format&fit=crop", createdAt: new Date().toISOString() },
            { id: "2", title: "Figma UI Kit Modern", description: "UI Kit thiết kế web hiện đại", type: "link", url: "https://figma.com", icon: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=200&auto=format&fit=crop", createdAt: new Date().toISOString() }
        ];

        // --- STATES ---
        let resources = [];
        let isAdmin = false;
        let currentResType = 'file';
        let currentIconType = 'link';
        let fileBase64 = '';
        let iconBase64 = '';

        document.addEventListener('DOMContentLoaded', () => { fetchData(); });

        async function fetchData() {
            document.getElementById('loading-state').classList.remove('hidden-el');
            document.getElementById('resources-grid').classList.add('hidden-el');
            document.getElementById('empty-state').classList.add('hidden-el');

            if (GAS_WEB_APP_URL) {
                try {
                    const res = await fetch(`${GAS_WEB_APP_URL}?action=get`);
                    const data = await res.json();
                    resources = data.resources || [];
                } catch (e) { console.error("Lỗi:", e); resources = initialMockData; }
            } else {
                await new Promise(r => setTimeout(r, 600));
                resources = [...initialMockData];
            }
            renderResources();
        }

        function renderResources() {
            document.getElementById('loading-state').classList.add('hidden-el');
            const grid = document.getElementById('resources-grid');
            
            if (resources.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden-el');
                grid.classList.add('hidden-el');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden-el');
            grid.classList.remove('hidden-el');
            grid.innerHTML = '';

            resources.forEach(res => {
                const isLink = res.type === 'link';
                const imgHtml = res.icon 
                    ? `<img src="${res.icon}" alt="${res.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-80 group-hover:opacity-100">`
                    : `<div class="w-full h-full flex items-center justify-center"><i data-lucide="file-box" class="w-12 h-12 text-slate-600"></i></div>`;

                let adminBtns = isAdmin ? `
                    <div class="flex gap-2">
                        <button onclick="openAdminPanel('${res.id}')" class="p-2 bg-slate-800 rounded-lg hover:bg-amber-500/20 hover:text-amber-400 transition-colors border border-slate-700 hover:border-amber-500/50" title="Sửa"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button onclick="handleDeleteResource('${res.id}')" class="p-2 bg-slate-800 rounded-lg hover:bg-red-500/20 hover:text-red-400 transition-colors border border-slate-700 hover:border-red-500/50" title="Xóa"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>` : '';

                grid.innerHTML += `
                    <div class="group bg-slate-900/60 border border-slate-700/50 backdrop-blur-sm rounded-2xl overflow-hidden hover:border-cyan-500/50 hover:shadow-[0_0_25px_rgba(6,182,212,0.15)] transition-all duration-500 flex flex-col">
                        <div class="h-40 overflow-hidden relative bg-slate-800">
                            ${imgHtml}
                            <div class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-white/10">
                                <i data-lucide="${isLink ? 'link' : 'download'}" class="w-3 h-3 ${isLink ? 'text-blue-400' : 'text-emerald-400'}"></i> 
                                <span class="text-[10px] ${isLink ? 'text-blue-400' : 'text-emerald-400'} font-bold tracking-wide uppercase">${isLink ? 'Liên kết' : 'Tải về'}</span>
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            <h3 class="text-lg font-bold text-white mb-1.5 group-hover:text-cyan-400 transition-colors line-clamp-1">${res.title}</h3>
                            <p class="text-slate-400 text-sm mb-4 flex-1 line-clamp-2">${res.description || ''}</p>
                            <div class="flex items-center gap-2 mt-auto">
                                <button onclick="handleActionClick('${res.id}')" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white py-2 rounded-xl text-sm font-medium shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] transition-all duration-300 flex items-center justify-center gap-2">
                                    <i data-lucide="${isLink ? 'external-link' : 'download'}" class="w-4 h-4"></i> ${isLink ? 'Mở Link' : 'Tải Về'}
                                </button>
                                ${adminBtns}
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function handleActionClick(id) {
            const res = resources.find(r => r.id === id);
            if (!res) return;
            if (res.type === 'link' || (!res.url.startsWith('data:'))) {
                window.open(res.url, '_blank');
            } else {
                const a = document.createElement('a');
                a.href = res.url;
                a.download = res.title || 'download';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
        }

        // --- AUTH ---
        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden-el'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden-el'); }
        
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            if (email === 'hung@admin.com' && pass === 'hung@123') {
                isAdmin = true; closeLoginModal();
                document.getElementById('login-email').value = ''; document.getElementById('login-password').value = '';
                document.getElementById('login-error').classList.add('hidden-el');
                document.getElementById('btn-login-trigger').classList.add('hidden-el');
                document.getElementById('admin-controls').classList.remove('hidden-el');
                renderResources();
            } else {
                document.getElementById('login-error-text').innerText = 'Tài khoản hoặc mật khẩu sai!';
                document.getElementById('login-error').classList.remove('hidden-el');
            }
        }

        function handleLogout() {
            isAdmin = false;
            document.getElementById('btn-login-trigger').classList.remove('hidden-el');
            document.getElementById('admin-controls').classList.add('hidden-el');
            renderResources();
        }

        // --- ADMIN PANEL UI ---
        function setResType(type) {
            currentResType = type;
            const btnFile = document.getElementById('btn-type-file'), btnLink = document.getElementById('btn-type-link');
            const areaFile = document.getElementById('area-res-file'), areaLink = document.getElementById('area-res-link');
            const linkInput = document.getElementById('res-link-val');

            if (type === 'file') {
                btnFile.className = "flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-cyan-500/20 border-cyan-500 text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.2)] text-sm";
                btnLink.className = "flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700 text-sm";
                areaFile.classList.remove('hidden-el'); areaLink.classList.add('hidden-el');
                linkInput.removeAttribute('required');
            } else {
                btnLink.className = "flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-blue-500/20 border-blue-500 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.2)] text-sm";
                btnFile.className = "flex items-center justify-center gap-2 py-2.5 rounded-xl border bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700 text-sm";
                areaFile.classList.add('hidden-el'); areaLink.classList.remove('hidden-el');
                linkInput.setAttribute('required', 'true');
            }
        }

        function setIconType(type) {
            currentIconType = type;
            const btnLink = document.getElementById('btn-icon-link'), btnFile = document.getElementById('btn-icon-file');
            const areaLink = document.getElementById('area-icon-link'), areaFile = document.getElementById('area-icon-file');

            if (type === 'link') {
                btnLink.className = "text-xs px-3 py-1.5 rounded-md bg-cyan-500/20 text-cyan-400 transition-colors";
                btnFile.className = "text-xs px-3 py-1.5 rounded-md text-slate-400 hover:bg-slate-700 transition-colors";
                areaLink.classList.remove('hidden-el'); areaFile.classList.add('hidden-el');
            } else {
                btnFile.className = "text-xs px-3 py-1.5 rounded-md bg-cyan-500/20 text-cyan-400 transition-colors";
                btnLink.className = "text-xs px-3 py-1.5 rounded-md text-slate-400 hover:bg-slate-700 transition-colors";
                areaFile.classList.remove('hidden-el'); areaLink.classList.add('hidden-el');
            }
            updateIconPreview();
        }

        // Format Byte sang KB, MB
        function formatBytes(bytes, decimals = 1) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function handleFileSelect(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                if (type === 'file') {
                    fileBase64 = event.target.result;
                    const sizeStr = formatBytes(file.size);
                    const statusText = document.getElementById('file-status-text');
                    statusText.innerText = `Đã chọn: ${file.name} (${sizeStr})`;
                    statusText.classList.add('text-emerald-400');
                    statusText.classList.remove('text-slate-500');
                } else if (type === 'icon') {
                    iconBase64 = event.target.result;
                    updateIconPreview();
                }
            };
            reader.readAsDataURL(file);
        }

        function updateIconPreview() {
            const previewImg = document.getElementById('icon-preview-img');
            const placeholder = document.getElementById('icon-placeholder');
            let src = currentIconType === 'link' ? document.getElementById('icon-link-val').value : iconBase64;

            if (src) {
                previewImg.src = src;
                previewImg.classList.remove('hidden-el');
                placeholder.classList.add('hidden-el');
            } else {
                previewImg.classList.add('hidden-el');
                placeholder.classList.remove('hidden-el');
            }
        }

        function openAdminPanel(id = null) {
            document.getElementById('admin-panel-modal').classList.remove('hidden-el');
            document.getElementById('resourceForm').reset();
            fileBase64 = ''; iconBase64 = '';
            const fileStatusText = document.getElementById('file-status-text');
            fileStatusText.innerText = 'Hỗ trợ tự động đọc dung lượng';
            fileStatusText.classList.remove('text-emerald-400');
            fileStatusText.classList.add('text-slate-500');
            
            if (id) {
                const res = resources.find(r => r.id === id);
                document.getElementById('modal-title').innerHTML = '<i data-lucide="edit" class="text-cyan-400 w-5 h-5"></i> Sửa Tài Nguyên';
                document.getElementById('res-id').value = res.id;
                document.getElementById('res-title').value = res.title;
                document.getElementById('res-desc').value = res.description;
                
                setResType(res.type);
                if (res.type === 'link') { document.getElementById('res-link-val').value = res.url; } 
                else { 
                    fileBase64 = res.url; 
                    fileStatusText.innerText = '✅ Đã có file lưu sẵn'; 
                    fileStatusText.classList.add('text-emerald-400');
                    fileStatusText.classList.remove('text-slate-500');
                }

                if (res.icon && res.icon.startsWith('data:')) { setIconType('file'); iconBase64 = res.icon; } 
                else { setIconType('link'); document.getElementById('icon-link-val').value = res.icon || ''; }
            } else {
                document.getElementById('modal-title').innerHTML = '<i data-lucide="plus" class="text-cyan-400 w-5 h-5"></i> Thêm Tài Nguyên Mới';
                document.getElementById('res-id').value = '';
                setResType('file'); setIconType('link');
            }
            updateIconPreview(); lucide.createIcons();
        }

        function closeAdminPanel() { document.getElementById('admin-panel-modal').classList.add('hidden-el'); }

        async function handleSaveResource(e) {
            e.preventDefault();
            const id = document.getElementById('res-id').value;
            const isEdit = !!id;
            
            if (currentResType === 'file' && !fileBase64 && !isEdit) { alert("Vui lòng chọn file upload!"); return; }

            const payload = {
                id: id || Date.now().toString(),
                title: document.getElementById('res-title').value,
                description: document.getElementById('res-desc').value,
                type: currentResType,
                url: currentResType === 'link' ? document.getElementById('res-link-val').value : fileBase64,
                icon: currentIconType === 'link' ? document.getElementById('icon-link-val').value : iconBase64,
                createdAt: isEdit ? resources.find(r => r.id === id).createdAt : new Date().toISOString()
            };

            if (GAS_WEB_APP_URL) {
                try {
                    await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: isEdit ? 'update' : 'add', data: payload }) });
                    fetchData();
                } catch (err) { console.error(err); }
            } else {
                if (isEdit) { resources = resources.map(r => r.id === payload.id ? payload : r); } 
                else { resources.unshift(payload); }
                renderResources();
            }
            closeAdminPanel();
        }

        async function handleDeleteResource(id) {
            if(!window.confirm("Bạn có chắc chắn muốn xóa tài nguyên này?")) return;
            if (GAS_WEB_APP_URL) {
                try {
                    await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id }) });
                    fetchData();
                } catch (err) { console.error(err); }
            } else {
                resources = resources.filter(r => r.id !== id); renderResources();
            }
        }
    </script>
</body>
